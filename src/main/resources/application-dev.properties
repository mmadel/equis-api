# ===== Datasource (matches compose.yaml) =====
spring.datasource.url=jdbc:postgresql://localhost:5433/equis
spring.datasource.username=equis
spring.datasource.password=equis

# ===== JPA =====
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Logging =====
logging.level.com.equestrian.equis=debug
logging.level.org.flywaydb=info

# ===== Actuator (dev only: show DB status in /health) =====
management.endpoint.health.show-details=always

# ===== Dev defaults (prod has none: these come from the environment there) =====
app.base-url=${APP_BASE_URL:http://localhost:4200}
app.mail.mode=${APP_MAIL_MODE:log}
