# ===== Datasource =====
# From SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (set by docker-compose)

# ===== Docker Compose support: off inside a container =====
spring.docker.compose.enabled=false

# ===== Logging =====
logging.level.root=info
logging.level.com.equestrian.equis=info

# ===== Actuator =====
management.endpoint.health.show-details=never

# ===== Behind Nginx =====
server.forward-headers-strategy=framework
