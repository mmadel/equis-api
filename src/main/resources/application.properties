# ===== Application =====
spring.application.name=equis-api
spring.profiles.default=dev

# ===== Web =====
server.port=8080
server.servlet.context-path=/api

# ===== JPA / Hibernate =====
# Flyway owns the schema; Hibernate only checks entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Store timestamptz (audit fields) in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator =====
management.endpoints.web.exposure.include=health

# ===== App settings (bound to AppProperties) =====
# Public URL used in invite and set-password links
app.base-url=${APP_BASE_URL:http://localhost:4200}
# School time zone for session dates and times
app.time-zone=Africa/Cairo
# How far ahead dated sessions are generated
app.sessions.weeks-ahead=8

# ===== Auth settings (bound to AuthProperties) =====
# Refresh token lifetime, and the longer one used when "remember me" is ticked
app.refresh.ttl=7d
app.refresh.remember-ttl=30d
# Access token (JWT): base64 HMAC signing key of 32+ bytes, issuer claim, and lifetime
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=equis-api
app.jwt.access-ttl=15m
# Admin sign-in: wrong passwords allowed before the account locks, and how long the lock lasts
app.admin.lockout.max-attempts=5
app.admin.lockout.duration=15m
# How long an invite link and a password-reset link stay valid
app.invite.ttl=72h
app.reset.ttl=24h

spring.flyway.placeholders.adminEmail=${APP_ADMIN_EMAIL}
spring.flyway.placeholders.adminPasswordHash=${APP_ADMIN_PASSWORD_HASH}