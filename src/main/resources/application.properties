# ===== Application =====
spring.application.name=equis-api
spring.profiles.default=dev

# ===== Web =====
server.port=8080
server.servlet.context-path=/api

# ===== JPA / Hibernate =====
# Flyway owns the schema; Hibernate only checks entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Store timestamptz (audit fields) in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator =====
management.endpoints.web.exposure.include=health

# ===== App settings (bound to AppProperties) =====
# Public URL used in invite and set-password links
app.base-url=${APP_BASE_URL}
# School time zone for session dates and times
app.time-zone=Africa/Cairo

# ===== Session settings (bound to SessionProperties) =====
# How many weeks ahead dated sessions are generated
app.sessions.horizon-weeks=8
# When the daily generation runs, in the school time zone (Spring cron: second minute hour day month weekday)
app.sessions.generate-cron=0 0 4 * * *

# ===== Auth settings (bound to AuthProperties) =====
# Refresh token lifetime, and the longer one used when "remember me" is ticked
app.refresh.ttl=7d
app.refresh.remember-ttl=30d
# Access token (JWT): base64 HMAC signing key of 32+ bytes, issuer claim, and lifetime
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=equis-api
app.jwt.access-ttl=15m
# Admin sign-in: wrong passwords allowed before the account locks, and how long the lock lasts
app.admin.lockout.max-attempts=5
app.admin.lockout.duration=15m
# How long an invite link and a password-reset link stay valid
app.invite.ttl=72h
app.reset.ttl=24h

# ===== Mail settings (bound to MailSettings) =====
# log prints each email to the console; smtp sends it with spring.mail.* (Gmail in the trial)
app.mail.mode=${APP_MAIL_MODE}
# Must be the same address as APP_MAIL_USERNAME for Gmail
app.mail.from=${APP_MAIL_FROM:}
app.mail.from-name=Riding Schedule

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Gmail address and its app password (never the account password)
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# /health must not log in to the mail server (it would be DOWN in log mode, which has no credentials)
management.health.mail.enabled=false
# Spring Boot Admin adds a mail notifier once a mail sender exists; it needs the admin server, which is not enabled
spring.autoconfigure.exclude=de.codecentric.boot.admin.server.config.AdminServerNotifierAutoConfiguration

spring.flyway.placeholders.adminEmail=${APP_ADMIN_EMAIL}
spring.flyway.placeholders.adminPasswordHash=${APP_ADMIN_PASSWORD_HASH}