# Loaded on top of the main application.properties in tests (classpath:/config/ overrides classpath:/).
# Fixed signing key so tests do not depend on APP_JWT_SECRET. Test use only.
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtbG9uZyE=
# Emails are printed, never sent, and links use a fixed address.
app.mail.mode=log
app.base-url=http://test.local
app.rider-base-url=http://rider.test
# The school already using equis becomes the default club (migration V23).
spring.flyway.placeholders.defaultClubCode=school
spring.flyway.placeholders.defaultClubName=Riding School
# Flyway sees every club's rows (row-level security, V24).
spring.flyway.init-sqls=RESET ROLE; SET app.bypass_rls = 'on'
# Test databases also get db/testgrants: the app role may TRUNCATE there, for the test fixtures' clean-ups.
spring.flyway.locations=classpath:db/migration,classpath:db/testgrants
